         function add_legend2() {
    
    var dataL = [];
    for (var i=0; i<colorScale.domain().length; i++) {
        
        dataL.push({"color":colorScale.range()[i],"value":Math.round(colorScale.domain()[i])});
    }
    
    var extent = d3.extent(dataL, d => d.value);
    
    var paddingL = 50;
    var widthL = 320;
    var innerWidth = widthL - (paddingL * 2);
    var barHeight = 8;
    var heightL = 28;

    var xScale = d3.scaleLinear()
        .range([0, innerWidth])
        .domain(extent);

    var xTicks = dataL.filter(f => f.value % 10 === 0).map(d => d.value);//filter(f => f.value % 50 === 0).

    var xAxis = d3.axisBottom(xScale)
        .tickSize(barHeight * 2)
        .tickValues(xTicks);

    var svgL = d3.select("#canvas_root1").append("g").attr("class","legend").attr("width", widthL).attr("height", heightL);
    var g = svgL.append("g").attr("transform", "translate(" + paddingL + ", 50)");

    var defs = svgL.append("defs");
    var linearGradient = defs.append("linearGradient").attr("id", "myGradient");
    linearGradient.selectAll("stop")
        .data(dataL)
      .enter().append("stop")
        .attr("offset", d => ((d.value - extent[0]) / (extent[1] - extent[0]) * 100) + "%")
        .attr("stop-color", d => d.color);

    g.append("rect")
        .attr("width", innerWidth)
        .attr("height", barHeight)
        .style("fill", "url(#myGradient)");

    g.append("g")
        .call(xAxis)
      .select(".domain").remove();
}
